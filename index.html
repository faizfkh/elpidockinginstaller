<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELPI Docking Specialist Monitoring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* =====================================================================
 * Styles.html — ELPI Docking Specialist Monitoring · design system v2
 * Corporate navy/blue di atas fondasi netral. Komponen: shell, sidebar,
 * panel, metric strip, tabel, badge, form, modal, Gantt, chart, motion.
 * ===================================================================== */
:root {
  --navy: #17365D; --blue: #245B91; --blue-600: #1E4D7B; --blue-50: #EAF2F8; --blue-100: #D6E5F2; --blue-200: #B5CFE6;
  --bg: #F5F7FA; --surface: #FFFFFF; --surface-2: #F8FAFC; --border: #E2E8F0; --border-2: #EDF1F5; --border-strong: #CBD5E1;
  --text: #263445; --text-2: #4A5869; --muted: #718096; --faint: #A0ABB8;
  --green: #23865B; --green-50: #E9F5EF; --amber: #D69E2E; --amber-ink: #A87412; --amber-50: #FBF3E2;
  --red: #D64545; --red-ink: #B83232; --red-50: #FCEDED; --info: #3982B8; --info-50: #E8F1F9; --grey: #8793A2; --grey-50: #F0F2F5;
  --teal: #1F8483; --teal-50: #E5F3F2; --orange: #D9772B; --orange-50: #FCEFE3; --violet: #6E62A6; --violet-50: #EFEDF7;
  /* tipe docking/survey */
  --c-as: #3982B8; --c-is: #1F8483; --c-ss: #17365D; --c-btm: #5BA3A2; --c-ts: #5E7186; --c-md: #8793A2; --c-em: #D64545; --c-mod: #D69E2E;
  --primary: var(--blue); --primary-50: var(--blue-50); --primary-100: var(--blue-100); --primary-200: var(--blue-200); --primary-600: var(--navy);
  --yellow: var(--amber-ink);
  --sidebar: 248px; --sidebar-mini: 68px; --topbar: 56px;
  --radius: 8px; --radius-sm: 6px;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, .04);
  --shadow: 0 1px 3px rgba(16, 24, 40, .06), 0 1px 2px rgba(16, 24, 40, .04);
  --shadow-lg: 0 12px 32px -8px rgba(15, 35, 60, .18), 0 4px 10px -4px rgba(15, 35, 60, .08);
  --ease: cubic-bezier(.2, .7, .2, 1);
  --font: 'Inter', 'Geist', 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); font-size: 13.5px; line-height: 1.5; color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; }
a { color: var(--blue); text-decoration: none; }
a:hover { color: var(--navy); text-decoration: underline; text-underline-offset: 2px; }
h1, h2, h3 { margin: 0; color: var(--text); letter-spacing: -.01em; }
h1 { font-size: 24px; font-weight: 600; line-height: 1.25; }
h2 { font-size: 14px; font-weight: 600; }
h3 { font-size: 13.5px; font-weight: 600; }
p { margin: 0; }
svg.ico { width: 18px; height: 18px; flex: none; fill: currentColor; stroke: none; }
.num, .money, .stat-val, .kpi-val { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12.5px; } .tiny { font-size: 11.5px; }
.right { text-align: right; } .center { text-align: center; } .nowrap { white-space: nowrap; } .hidden { display: none !important; }
.row { display: flex; align-items: center; gap: 8px; } .spacer { flex: 1; } .stack { display: flex; flex-direction: column; gap: 16px; }
.money { font-size: 17px; font-weight: 600; color: var(--text); letter-spacing: -.01em; }
::selection { background: var(--blue-100); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* ---------- warna kategori (ikon) ---------- */
.tone-blue { --tone: #2463EB; --tone-bg: var(--blue-50); } .tone-navy { --tone: #1E3A8A; --tone-bg: #E6ECF4; }
.tone-teal { --tone: #0E9F9A; --tone-bg: var(--teal-50); } .tone-green { --tone: #1FA55A; --tone-bg: var(--green-50); }
.tone-orange { --tone: #EA6A17; --tone-bg: var(--orange-50); } .tone-amber { --tone: #E09A12; --tone-bg: var(--amber-50); }
.tone-red { --tone: #DC2A2A; --tone-bg: var(--red-50); } .tone-violet { --tone: #7C4DDB; --tone-bg: var(--violet-50); }
.tone-slate { --tone: #64748B; --tone-bg: var(--grey-50); } .tone-info { --tone: #1A9BD7; --tone-bg: var(--info-50); }
.ibox { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--tone, var(--blue)); color: #fff; flex: none; box-shadow: 0 4px 10px -5px var(--tone, var(--blue)); }
.ibox.sm { width: 28px; height: 28px; border-radius: 8px; } .ibox.sm svg.ico { width: 16px; height: 16px; }
.ibox.lg { width: 42px; height: 42px; border-radius: 11px; } .ibox.lg svg.ico { width: 22px; height: 22px; }
.ibox svg.ico { width: 18px; height: 18px; }
.ico-tone { color: var(--tone); }

/* ---------- shell ---------- */
.shell { display: flex; min-height: 100vh; }
.sidebar { width: var(--sidebar); background: var(--surface); border-right: 1px solid var(--border); position: fixed; inset: 0 auto 0 0; z-index: 40;
  display: flex; flex-direction: column; transition: width .22s var(--ease), transform .22s var(--ease); }
.brand { display: flex; align-items: center; gap: 11px; height: 64px; padding: 0 18px; border-bottom: 1px solid var(--border-2); flex: none; overflow: hidden; }
.brand-logo { height: 24px; width: auto; flex: none; display: block; }
.brand-text { min-width: 0; padding-left: 11px; border-left: 1px solid var(--border); }
.brand-name { font-size: 12.5px; font-weight: 600; color: var(--navy); line-height: 1.25; white-space: nowrap; }
.brand-sub { font-size: 11px; color: var(--muted); white-space: nowrap; }
.nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 10px 16px; scrollbar-width: thin; }
.nav-group + .nav-group { margin-top: 14px; }
.nav-label { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--grey); padding: 4px 10px 6px; white-space: nowrap; }
.nav a { position: relative; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 6px; color: var(--text-2);
  font-size: 13px; font-weight: 500; white-space: nowrap; transition: background .16s var(--ease), color .16s var(--ease); }
.nav a svg.ico { width: 17px; height: 17px; color: var(--tone, var(--muted)); transition: transform .16s var(--ease); }
.nav a:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
.nav a:hover svg.ico { transform: translateX(1px); }
.nav a.active { background: var(--blue-50); color: var(--navy); font-weight: 600; }
.nav a.active::before { content: ''; position: absolute; left: -10px; top: 7px; bottom: 7px; width: 3px; border-radius: 0 3px 3px 0; background: var(--blue); }
.nav .count { margin-left: auto; font-size: 10.5px; font-weight: 600; color: var(--red-ink); background: var(--red-50); border-radius: 10px; padding: 0 7px; line-height: 18px; }
.side-foot { flex: none; border-top: 1px solid var(--border-2); padding: 8px 10px; display: flex; align-items: center; gap: 8px; }
.side-foot .meta { font-size: 11px; color: var(--muted); line-height: 1.35; white-space: nowrap; overflow: hidden; padding-left: 4px; }
.collapse-btn { margin-left: auto; }
.main { margin-left: var(--sidebar); flex: 1; min-width: 0; display: flex; flex-direction: column; transition: margin-left .22s var(--ease); }
body.nav-mini .sidebar { width: var(--sidebar-mini); }
body.nav-mini .main { margin-left: var(--sidebar-mini); }
body.nav-mini .brand { padding: 0 12px; justify-content: center; }
body.nav-mini .brand-text, body.nav-mini .nav-label, body.nav-mini .nav a span, body.nav-mini .side-foot .meta { display: none; }
body.nav-mini .brand-logo { height: 20px; }
body.nav-mini .nav-group + .nav-group { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-2); }
body.nav-mini .nav a { justify-content: center; padding: 0; }
body.nav-mini .nav .count { position: absolute; top: 2px; right: 6px; padding: 0 4px; line-height: 14px; font-size: 9.5px; }
body.nav-mini .side-foot { justify-content: center; }
body.nav-mini .collapse-btn { margin: 0; }
.topbar { position: sticky; top: 0; z-index: 30; height: var(--topbar); background: rgba(255, 255, 255, .96); backdrop-filter: saturate(1.4) blur(6px);
  border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 0 24px; }
.iconbtn.menu-burger { display: none; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; }
.crumbs a { color: var(--muted); } .crumbs a:hover { color: var(--blue); }
.crumbs b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.crumbs .sep { color: var(--faint); display: inline-flex; } .crumbs .sep svg.ico { width: 13px; height: 13px; }
.today-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); padding: 0 10px; height: 32px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); white-space: nowrap; }
.today-pill svg.ico { width: 14px; height: 14px; color: var(--teal); }
.search { position: relative; display: flex; align-items: center; width: 260px; }
.search > svg.ico { position: absolute; left: 10px; color: var(--faint); width: 15px; height: 15px; }
.search input { width: 100%; height: 34px; border: 1px solid var(--border); border-radius: 6px; padding: 0 44px 0 32px; font: inherit; font-size: 13px; background: var(--surface-2); color: var(--text);
  transition: border-color .15s, background .15s, box-shadow .15s; }
.search input:focus { outline: none; background: #fff; border-color: var(--blue-200); box-shadow: 0 0 0 3px rgba(36, 91, 145, .12); }
.search kbd { position: absolute; right: 8px; font: 500 10.5px var(--font); color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; background: #fff; }
.search-results { position: absolute; top: 40px; left: 0; right: 0; background: #fff; border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-lg); padding: 4px; z-index: 50; animation: drop .16s var(--ease); }
.search-results a { display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 5px; color: var(--text); font-size: 13px; }
.search-results a:hover, .search-results a.sel { background: var(--blue-50); text-decoration: none; }
.iconbtn { position: relative; display: inline-grid; place-items: center; width: 34px; height: 34px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--text-2); cursor: pointer;
  transition: background .15s var(--ease), color .15s, border-color .15s, transform .12s; }
.iconbtn:hover { background: var(--surface-2); border-color: var(--border); color: var(--text); }
.iconbtn:active { transform: scale(.94); }
.iconbtn svg.ico { width: 17px; height: 17px; }
.iconbtn .dot { position: absolute; top: -2px; right: -6px; min-width: 19px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; line-height: 14px; border: 2px solid #fff; box-sizing: border-box; text-align: center; }
.userchip { display: flex; align-items: center; gap: 9px; padding: 3px 8px 3px 3px; border: 1px solid transparent; border-radius: 8px; cursor: pointer; transition: background .15s, border-color .15s; }
.userchip:hover { background: var(--surface-2); border-color: var(--border); }
.userchip .who { line-height: 1.25; } .userchip .who b { display: block; font-size: 12.5px; font-weight: 600; } .userchip .who span { font-size: 11px; color: var(--muted); }
.userchip > svg.ico { width: 14px; height: 14px; color: var(--muted); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: #fff; display: grid; place-items: center; font-size: 11.5px; font-weight: 600; flex: none; letter-spacing: .02em; }
.content { padding: 22px 28px 40px; min-width: 0; }
.scrim { display: none; }

/* ---------- kepala halaman ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head > div:first-child { min-width: 0; max-width: 760px; }
.page-head p { margin-top: 4px; color: var(--muted); font-size: 13px; }
.page-head .eyebrow { display: flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.section-title { display: flex; align-items: baseline; gap: 4px 10px; margin: 24px 0 10px; flex-wrap: wrap; }
.section-title h2 { font-size: 15px; } .section-title span { font-size: 12px; color: var(--muted); }

/* ---------- panel ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--border-2); min-height: 48px; }
.card-head h2 { font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
.card-head .meta { font-size: 12px; color: var(--muted); }
.card-body { padding: 16px; } .card-body.flush { padding: 0; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g6 { grid-template-columns: repeat(6, minmax(0, 1fr)); } .g7 { grid-template-columns: repeat(7, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }
.card.fill { height: 100%; }
.grid.m2x2 > .stat:nth-child(3) { border-left: 0; } .grid.m2x2 > .stat:nth-child(n+3) { border-top: 1px solid var(--border-2); }
.dl { display: grid; grid-template-columns: 150px 1fr; gap: 0; margin: 0; font-size: 13px; }
.dl dt { color: var(--muted); padding: 7px 0; border-bottom: 1px solid var(--border-2); }
.dl dd { margin: 0; padding: 7px 0; border-bottom: 1px solid var(--border-2); color: var(--text); font-weight: 500; }
.dl dt:nth-last-child(2), .dl dd:last-child { border-bottom: 0; }

/* ---------- metric strip: grid berisi .stat menjadi satu panel bersekat ---------- */
.grid:has(> .stat) { gap: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; }
.stat { display: flex; align-items: flex-start; gap: 11px; padding: 13px 16px; min-width: 0; position: relative; }
.grid > .stat + .stat { border-left: 1px solid var(--border-2); }
.stat .ibox { margin-top: 1px; }
.stat-val { font-size: 19px; font-weight: 650; line-height: 1.25; color: var(--text); letter-spacing: -.01em; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 24px; }
.stat-val small { font-size: 12px; font-weight: 500; color: var(--muted); }
.stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
.stat.alert .stat-val { color: var(--red-ink); }

.card.stat { padding: 13px 16px; }

/* ---------- dashboard ---------- */
.fleet-strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.fleet-strip .fs { display: flex; gap: 12px; align-items: center; padding: 14px 18px; min-width: 0; }
.fleet-strip .fs + .fs { border-left: 1px solid var(--border-2); }
.fs-val { font-size: 22px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; }
.fs-label { font-size: 12.5px; font-weight: 500; color: var(--text-2); }
.fs-note { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.perf { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.perf .pk { display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 13px; min-width: 0; color: inherit; transition: background .16s var(--ease); }
.perf .pk + .pk { border-left: 1px solid var(--border-2); }
.perf .pk:hover { background: var(--surface-2); text-decoration: none; }
.pk-top { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: var(--text-2); min-height: 26px; }
.pk-val { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; color: var(--text); display: flex; align-items: baseline; gap: 5px; }
.pk-val small { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.pk-sub { font-size: 11.5px; color: var(--muted); line-height: 1.4; min-height: 32px; }
.pk-foot { display: flex; align-items: center; gap: 6px; margin-top: auto; font-size: 11.5px; }
.trend { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; font-size: 11.5px; font-weight: 600; }
.trend svg.ico { width: 13px; height: 13px; stroke-width: 2.2; }
.trend.good, .trend.up-good, .trend.down-good { color: var(--green); } .trend.bad, .trend.up-bad, .trend.down-bad { color: var(--red-ink); } .trend.flat { color: var(--muted); font-weight: 500; }
.ring { --p: 0; width: 46px; height: 46px; border-radius: 50%; background: conic-gradient(var(--ring-c, var(--green)) calc(var(--p) * 1%), var(--border-2) 0); display: grid; place-items: center; flex: none; }
.ring::before { content: ''; width: 34px; height: 34px; border-radius: 50%; background: #fff; grid-area: 1 / 1; }
.ring b { grid-area: 1 / 1; position: relative; font-size: 10.5px; font-weight: 700; color: var(--text); }
.split { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 16px; }
.split-r { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.65fr); gap: 16px; }
.dist { display: flex; flex-direction: column; gap: 11px; }
.dist-row { display: grid; grid-template-columns: 136px 1fr minmax(28px, auto); align-items: center; gap: 10px; font-size: 12.5px; }
.dist-row b { white-space: nowrap; }
.dist-row .bar { height: 8px; border-radius: 4px; background: var(--border-2); overflow: hidden; }
.dist-row .bar i { display: block; height: 100%; border-radius: 4px; transition: width .5s var(--ease); }
.stackbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--border-2); }
.stackbar i { display: block; height: 100%; } .stackbar i + i { border-left: 2px solid #fff; }
.mini-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-2); }
.mini-legend span { display: inline-flex; align-items: center; gap: 6px; } .mini-legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: #fff; font: 500 12px var(--font); color: var(--text-2); cursor: pointer;
  transition: background .15s, border-color .15s, color .15s; }
.chip:hover { border-color: var(--border-strong); color: var(--text); }
.chip.on { background: var(--blue-50); border-color: var(--blue-200); color: var(--navy); }
.chip .n { font-size: 11px; font-weight: 600; color: var(--muted); } .chip.on .n { color: var(--blue); }
.sev { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.sev.critical { background: var(--red); box-shadow: 0 0 0 3px var(--red-50); } .sev.high { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-50); } .sev.medium { background: var(--info); box-shadow: 0 0 0 3px var(--info-50); }
.info-strip { display: flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.info-strip .it { padding: 11px 18px; min-width: 0; } .info-strip .it + .it { border-left: 1px solid var(--border-2); }
.info-strip .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.info-strip .v { font-size: 13.5px; font-weight: 600; color: var(--text); margin-top: 2px; white-space: nowrap; }

.cmp-row { display: grid; grid-template-columns: 150px 1fr 96px; gap: 3px 10px; align-items: center; font-size: 12px; }

/* ---------- badge & chip status ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px; border-radius: 4px; font-size: 11.5px; font-weight: 600; white-space: nowrap;
  background: var(--grey-50); color: #5F6B7A; line-height: 1; vertical-align: middle; }
.badge.green { background: var(--green-50); color: var(--green); } .badge.blue { background: var(--blue-50); color: var(--blue); }
.badge.info { background: var(--info-50); color: var(--info); } .badge.navy { background: #E6ECF4; color: var(--navy); }
.badge.yellow, .badge.amber { background: var(--amber-50); color: var(--amber-ink); } .badge.orange { background: var(--orange-50); color: #B45F1C; }

.seg { display: inline-flex; padding: 2px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface-2); }

/* ---------- form ---------- */

.tbl input.cell { width: 100%; min-width: 64px; height: 28px; border: 1px solid transparent; border-radius: 4px; padding: 0 7px; text-align: right; font: inherit; color: var(--text); background: transparent; font-variant-numeric: tabular-nums;
  transition: border-color .15s, background .15s, box-shadow .15s; }

.linkrow:last-child { border-bottom: 0; }
.linkrow > span:not(.ibox) { flex: 1; min-width: 0; } .linkrow b { display: block; font-size: 13px; font-weight: 600; } .linkrow span span { font-size: 11.5px; color: var(--muted); }

.linkrow:hover { background: var(--surface-2); text-decoration: none; color: var(--text); } .linkrow:hover > svg.ico { transform: translateX(2px); color: var(--blue); }

.g-head .g-today-lab { position: absolute; top: 2px; transform: translateX(-50%); background: var(--red); color: #fff; font-size: 9.5px; font-weight: 700; padding: 1px 5px; border-radius: 3px; z-index: 8; white-space: nowrap; }

/* ---------- kalender ---------- */

/* ---------- chart ---------- */

.modal { width: 100%; max-width: 520px; max-height: calc(100vh - 48px); display: flex; flex-direction: column; background: #fff; border-radius: 10px; box-shadow: var(--shadow-lg); animation: modalin .22s var(--ease); }

.dropdown button.danger, .dropdown button.danger svg.ico { color: var(--red-ink); }
.notif-panel { width: 380px; padding: 0; max-height: 480px; display: flex; flex-direction: column; }
.notif-panel .np-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border-2); }

.notif .nt { font-weight: 600; font-size: 12px; text-transform: capitalize; } .notif .nm { color: var(--text-2); } .notif .nd { font-size: 11px; color: var(--faint); }
.toasts { position: fixed; right: 20px; bottom: 20px; z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast { display: flex; align-items: flex-start; gap: 10px; min-width: 260px; max-width: 420px; background: #fff; color: var(--text); border: 1px solid var(--border); border-left: 3px solid var(--info);
  border-radius: 7px; padding: 10px 14px 10px 12px; font-size: 13px; box-shadow: var(--shadow-lg); animation: toastin .22s var(--ease); }

a.badge:hover { text-decoration: none; border-color: #98A2B3; }

/* =====================================================================
 * v1.5 — palet hijau + oranye (dari palet foto: ink #13222B, hijau #1D5650, oranye #F39200, teal #50B0AE, kuning #F6C21E).
 * Tanpa garis tepi (outline) dan tanpa latar pastel: permukaan dibedakan oleh isi warna solid dan bayangan halus.
 * Ikon kategori tetap memakai warna beragam (biru, ungu, merah, dst.).
 * ===================================================================== */
:root {
  --ink: #13222B; --g-700: #1D5650; --g-800: #154540; --g-600: #23675F; --or: #F39200; --or-700: #C97700; --tl: #50B0AE; --yl: #F6C21E;
  --navy: var(--ink); --blue: var(--g-700); --blue-600: var(--g-800); --blue-50: #EDF1EF; --blue-100: #DCE5E1; --blue-200: #C3D2CC;
  --action: var(--g-700); --action-600: var(--g-800); --action-50: #EDF1EF;
  --primary: var(--g-700); --primary-600: var(--g-800);
  --bg: #F1F3F2; --surface-2: #F6F7F6; --border: #E3E7E5; --border-2: #ECEFEE;
  --c-as: #3A9E9B; --c-is: #E08600; --c-ss: #1D5650;
  --fill: #EBEEEC; --fill-2: #E1E6E3;
  --lift: 0 1px 2px rgba(19, 34, 43, .05), 0 6px 18px -10px rgba(19, 34, 43, .14);
}
body { background: var(--bg); }
a { color: var(--g-700); } a:hover { color: var(--ink); }
::selection { background: #FFE0B0; }
:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
/* sidebar & topbar: tanpa garis pemisah */
.sidebar { border-right: 0; box-shadow: 1px 0 0 rgba(19, 34, 43, .04), 6px 0 24px -18px rgba(19, 34, 43, .25); }
.brand-name, .card-head h2, .page-head h1, .kcard .kv, .sync-card b { color: var(--ink); }
.nav a { color: #24343D; } .nav a svg.ico { color: #61707A; }
.nav a:hover { background: var(--fill); color: var(--ink); }
.nav a.active { background: var(--g-700); color: #fff; }
.nav a.active svg.ico { color: #fff; }
.nav a.active::before { display: none; }
.nav a.active .count { box-shadow: 0 0 0 2px var(--g-700); }
.sync-card { border: 0; background: var(--fill); }
.topbar { border-bottom: 0; background: rgba(241, 243, 242, .92); backdrop-filter: blur(8px); }
.topbar .search input { background: #fff; border-color: transparent; box-shadow: var(--lift); }
.sync-pill { border: 0; background: #fff; box-shadow: var(--lift); }
.cbtn { border: 0; background: #fff; box-shadow: var(--lift); }
.cbtn:hover { background: #fff; border: 0; box-shadow: 0 6px 16px -8px rgba(19, 34, 43, .35); }
.cbtn svg.ico { color: var(--ink); }
.userchip .avatar { background: var(--or); color: #fff; }
/* kartu: tanpa outline, bayangan halus */
.card, .stat, .kcard { border: 0 !important; box-shadow: var(--lift); }
.kcard:hover { box-shadow: 0 14px 28px -14px rgba(19, 34, 43, .35); }
.grid > .stat + .stat, .grid.m2x2 > .stat { border: 0 !important; }
.card-head { border-bottom-color: var(--border-2); }
/* tombol */
.btn { border-color: transparent; background: var(--fill); color: var(--ink); box-shadow: none; }
.btn:hover { background: var(--fill-2); border-color: transparent; color: var(--ink); }
.btn.primary { background: var(--g-700); border-color: var(--g-700); color: #fff; }
.btn.primary:hover { background: var(--g-800); border-color: var(--g-800); }
.btn.accent { background: var(--or); border-color: var(--or); color: #fff; } .btn.accent:hover { background: var(--or-700); }
.btn.ghost { background: transparent; } .btn.ghost:hover { background: var(--fill); }
.btn.danger, .btn.danger:hover { border-color: transparent; background: #FDECEA; color: #B42318; }
.btn.danger:hover { background: #FBD9D5; }
.iconbtn { border-color: transparent; } .iconbtn:hover { background: var(--fill); border-color: transparent; }
/* input: isian berwarna, garis hanya saat fokus */
.input, select.input, textarea.input { border-color: transparent; background-color: var(--fill); }
.input:hover { border-color: transparent; background-color: var(--fill-2); }
.input:focus { background-color: #fff; border-color: var(--g-700); box-shadow: 0 0 0 3px rgba(29, 86, 80, .15); }
.card .tbl-tools .input, .modal .input { background-color: var(--surface-2); }
/* chip filter & segmen: isi solid, tanpa outline */
.chip { border: 0; background: var(--fill); color: #3A4A53; height: 30px; padding: 0 12px; border-radius: 999px; }
.chip:hover { background: var(--fill-2); color: var(--ink); }
.chip.on { background: var(--ink); color: #fff; }
.chip .n { color: #6B7A82; } .chip.on .n { color: var(--yl); }
.seg { border: 0; background: var(--fill); padding: 3px; border-radius: 999px; }
.seg button { border-radius: 999px; }
.seg button.on { background: var(--g-700); color: #fff; box-shadow: none; }
.tabs a.on { color: var(--ink); } .tabs a::after { background: var(--or); height: 3px; }
/* badge & ikon kapal */
.badge { border: 0; background: var(--fill); color: #33434C; }
.badge.blue, .badge.outline { background: var(--fill); color: var(--g-700); border: 0; }
a.badge:hover { background: var(--fill-2); }
.ship-ico { background: var(--g-700); color: #fff; box-shadow: 0 6px 14px -8px var(--g-700); }
/* status, progres */
.st.blue > i { background: var(--tl); } .st.navy > i, .st.purple > i { background: var(--g-700); } .st.green > i { background: #2E9E5B; }
.hp-bar i, .pk-bar i { background: var(--g-700); }
.notice { background: #FFF4E0; } .notice b { color: #9A5B00; } .notice svg.ico { color: var(--or); }
.notice.red { background: #FDECEA; }
/* banner foto */
.hero { background: var(--ink); box-shadow: 0 18px 38px -22px rgba(19, 34, 43, .7); }
.hero-bg img { object-position: center 55%; }
.hero::before { background: linear-gradient(90deg, rgba(19, 34, 43, .94) 0%, rgba(19, 34, 43, .82) 32%, rgba(19, 34, 43, .35) 60%, rgba(19, 34, 43, .05) 100%); }
.hero-chip { border: 0; background: rgba(255, 255, 255, .14); }
.hero-chip b { background: var(--or); color: #fff; }
.hero-btn { color: var(--ink); } .hero-btn:hover { color: var(--ink); }
.hero-btn .ci { background: var(--or); }
.hero-btn.ghost { border: 0; background: rgba(255, 255, 255, .16); }
.hero-btn.ghost:hover { background: rgba(255, 255, 255, .26); }
.hero-panel .hp-row { border-bottom-color: #EEF1EF; }
@media (max-width: 960px) { .hero::before { background: linear-gradient(180deg, rgba(19, 34, 43, .9), rgba(19, 34, 43, .72)); } }
/* form masuk/daftar: isian putih di atas latar abu */
.auth-card .input { background-color: #fff; box-shadow: 0 1px 2px rgba(19, 34, 43, .06); }
/* halaman masuk: foto kapal penuh, judul di bawah */
.auth-side { padding: 40px 48px; justify-content: flex-end; background: var(--ink); }
.auth-side::before { z-index: 1; background: linear-gradient(180deg, rgba(19, 34, 43, 0) 45%, rgba(19, 34, 43, .55) 75%, rgba(19, 34, 43, .88) 100%); }
.auth-side > * { z-index: 2; }
.auth-side > .auth-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% center; z-index: 0; margin: 0; }
.auth-side > .auth-title { margin-top: 0; }
.auth-title h1 { font-size: 30px; font-weight: 700; margin: 0 0 18px; max-width: 420px; letter-spacing: -.02em; }
.auth-foot { color: rgba(255, 255, 255, .72); }
/* tombol Install */
.install-btn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px 0 13px; border: 0; border-radius: 999px; background: var(--or); color: #fff;
  font: 600 14px var(--font); cursor: pointer; box-shadow: 0 6px 16px -8px rgba(243, 146, 0, .8); transition: background .15s, transform .15s var(--ease); white-space: nowrap; }
.install-btn:hover { background: var(--or-700); transform: translateY(-1px); }
.install-btn svg.ico { width: 18px; height: 18px; }
.install-btn.hidden { display: none; }
.install-steps { margin: 0; padding-left: 20px; display: grid; gap: 10px; font-size: 14px; }
.install-steps svg.ico { width: 17px; height: 17px; vertical-align: -3px; color: var(--g-700); }
@media (max-width: 720px) { .install-btn { width: 38px; height: 38px; padding: 0; justify-content: center; } .install-btn span { display: none; } }
/* tombol Install di halaman masuk */
.auth { position: relative; }
.auth-install { position: absolute; z-index: 5; top: 24px; right: 24px; height: 38px; font-size: 13.5px; animation: rise .3s var(--ease); }
/* halaman masuk di HP: foto jadi header, form di bawah dalam lembar putih */
@media (max-width: 960px) {
  .auth { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; background: #fff; }
  .auth .auth-side { display: flex; min-height: 38vh; max-height: 340px; padding: 20px 20px 44px; }
  .auth-side > .auth-photo { object-position: 62% 40%; }

.tbl tbody tr:hover td { background: #F6F8F7; }

function fmtDate(iso) {
  if (!iso) return '—';

function initials(s) { return String(s || '?').split(/\s+/).map(function (w) { return w[0]; }).slice(0, 2).join('').toUpperCase(); }

/* ---------- API ---------- */
function api(action, payload, opts) {
  opts = opts || {};
  return new Promise(function (resolve, reject) {
    google.script.run.withSuccessHandler(function (res) {
      if (!res) return reject(new Error('Server tidak merespons.'));
      if (res.ok) { if (!/\.(list|get|detail|summary|suggest|compare|fiveYear|month|items|lists|performance|info|me)$|^(bootstrap|dashboard|export\.pdf)$/.test(action)) App.selfWrite = Date.now(); return resolve(res.data); }
      if (res.auth) { logout(true); toast(res.error, 'error'); }
      else if (!opts.silent) { /* pemanggil yang menampilkan error */ }
      reject(new Error(res.error));
    }).withFailureHandler(function (err) {
      reject(new Error((err && err.message) || 'Gagal menghubungi server. Periksa koneksi lalu coba lagi.'));
    }).api(App.token, action, payload || {});
  });
}
function apiToast(action, payload, okMsg) {
  return api(action, payload).then(function (d) { if (okMsg) toast(okMsg, 'success'); return d; })
    .catch(function (e) { toast(e.message, 'error'); throw e; });
}

/* ---------- toast ---------- */
function toast(msg, type) {
  var box = $('.toasts') || document.body.appendChild(h('<div class="toasts" role="status" aria-live="polite"></div>'));
  var ico = type === 'success' ? 'circle-check' : type === 'error' ? 'circle-alert' : 'info';
  var t = h('<div class="toast ' + (type || '') + '">' + icon(ico) + '<span>' + esc(msg) + '</span></div>');
  box.appendChild(t);
  while (box.children.length > 4) box.firstChild.remove();
  setTimeout(function () { t.classList.add('out'); setTimeout(function () { t.remove(); }, 210); }, type === 'error' ? 6000 : 3200);
}

/* ------------------------------------------------------------ tombol Install (PWA)
 * Dua mode:
 *  - Hosted (GitHub Pages): halaman ini sendiri adalah PWA. Tombol memanggil dialog install bawaan browser langsung
 *    (window.__elpiPrompt ditangkap dari event beforeinstallprompt oleh skrip di <head>).
 *  - Apps Script (/exec): halaman dikendalikan Google dan tidak bisa dipasang; tombol membuka halaman PWA (Configuration → pwa_url).
 */
function setupInstall() {
  var btn = $('#installBtn'); if (!btn) return;
  var hosted = !!window.ELPI_HOSTED;
  var url = String((window.APP_META && APP_META.pwaUrl) || ((App.boot || {}).config || {}).pwa_url || '');
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function standalone() { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
  function render() { var b = $('#installBtn'); if (b) b.classList.toggle('hidden', standalone() || !(hosted || url)); }
  function steps(title, html) { openModal({ title: title, foot: false, body: html }); }
  btn.addEventListener('click', function () {
    if (hosted) {
      var p = window.__elpiPrompt;
      if (p) {   // dialog "Install app" bawaan browser, tanpa membuka menu ⋮
        window.__elpiPrompt = null;
        p.prompt();
        p.userChoice.then(function (r) { if (r.outcome === 'accepted') toast('Memasang aplikasi…', 'success'); else window.__elpiPrompt = p; });
        return;
      }
      if (ios) {
        steps('Pasang di iPhone / iPad', '<ol class="install-steps"><li>Ketuk tombol <b>Bagikan</b> ' + icon('ios-share') + ' di bawah layar Safari.</li>' +
          '<li>Pilih <b>Tambah ke Layar Utama</b> ' + icon('add-box') + '.</li><li>Ketuk <b>Tambah</b>. Ikon ELPI Docking muncul di layar utama.</li></ol>');
        return;
      }
      steps('Pasang aplikasi', '<p class="muted">Browser ini belum menawarkan pemasangan otomatis. Buka menu browser (⋮) lalu pilih <b>Install app</b> atau <b>Tambahkan ke layar utama</b>. ' +
        'Jika aplikasi sudah terpasang, buka dari ikon ELPI Docking di perangkat Anda.</p>');
      return;
    }
    if (url) window.open(url, '_blank', 'noopener');
  });
  window.addEventListener('appinstalled', function () { window.__elpiPrompt = null; render(); toast('Aplikasi terpasang. Buka dari ikon ELPI Docking.', 'success'); });
  render();
}

function openModal(opts) {
  var ov = h('<div class="overlay" role="dialog" aria-modal="true"><div class="modal ' + (opts.wide ? 'wide' : '') + '">' +
    '<div class="modal-head"><h2>' + esc(opts.title) + '</h2><button class="iconbtn" data-close aria-label="Tutup">' + icon('x') + '</button></div>' +
    '<div class="modal-body"></div>' + (opts.foot === false ? '' : '<div class="modal-foot"></div>') + '</div></div>');
  var body = $('.modal-body', ov);
  if (typeof opts.body === 'string') body.innerHTML = opts.body; else if (opts.body) body.appendChild(opts.body);
  var foot = $('.modal-foot', ov);
  var closed = false;
  function close() {
    if (closed) return; closed = true;
    document.removeEventListener('keydown', onKey);
    ov.classList.add('closing');
    setTimeout(function () { ov.remove(); }, 150);
    if (opts.onClose) opts.onClose();
  }
  function onKey(e) { if (e.key === 'Escape') close(); }
  document.addEventListener('keydown', onKey);
  ov.addEventListener('mousedown', function (e) { if (e.target === ov) close(); });
  $$('[data-close]', ov).forEach(function (b) { b.addEventListener('click', close); });
  if (foot && opts.buttons) opts.buttons.forEach(function (b) {
    var btn = h('<button class="btn ' + (b.cls || '') + '">' + esc(b.label) + '</button>');
    btn.addEventListener('click', function () { b.onClick ? b.onClick(close, btn) : close(); });
    foot.appendChild(btn);
  });
  document.body.appendChild(ov);
  var first = $('input:not([type=hidden]),select,textarea', body);
  if (first) setTimeout(function () { first.focus(); }, 30);
  return { el: ov, body: body, close: close };
}

function confirmDialog(message, o) {

    var done = false;
    openModal({ title: o.title || 'Konfirmasi', body: '<p style="margin:0">' + esc(message) + '</p>',
      onClose: function () { if (!done) resolve(false); },
      buttons: [{ label: 'Batal' }, { label: o.ok || 'Ya, lanjutkan', cls: o.danger ? 'danger' : 'primary', onClick: function (close) { done = true; close(); resolve(true); } }] });
  });

/**

    } else if (f.type === 'checkbox') {

    } else {
      var type = { money: 'text', number: 'number', date: 'date', password: 'password', email: 'email' }[f.type] || 'text';
      var val = f.type === 'money' && v !== '' ? fmtNum(v) : v;
      input = '<input class="input" id="' + id + '" name="' + f.name + '" type="' + type + '" value="' + esc(val) + '"' +
        (f.min !== undefined ? ' min="' + f.min + '"' : '') + (f.max !== undefined ? ' max="' + f.max + '"' : '') +
        (f.step !== undefined ? ' step="' + f.step + '"' : (type === 'number' ? ' step="any"' : '')) +
        ' placeholder="' + esc(f.placeholder || '') + '"' + (f.type === 'money' ? ' inputmode="numeric"' : '') + (f.readonly ? ' readonly' : '') + '>';
    }
    var wrap = h('<div class="field ' + (f.full || f.type === 'textarea' ? 'full' : '') + '" data-field="' + f.name + '">' +
      (f.type === 'checkbox' ? '' : '<label for="' + id + '">' + esc(f.label) + (f.required ? ' <span class="req">*</span>' : '') + '</label>') +
      input + (f.help ? '<div class="help">' + esc(f.help) + '</div>' : '') + '</div>');
    grid.appendChild(wrap);
    var money = $('input', wrap);
    if (f.type === 'money' && money) money.addEventListener('blur', function () { var n = parseMoney(money.value); if (n !== '') money.value = fmtNum(n); });
  });

  function read() {
    var out = Object.assign({}, o.values || {});

      var elx = form.elements[f.name];
      if (!elx) return;
      if (f.type === 'checkbox') out[f.name] = elx.checked;
      else if (f.type === 'money') out[f.name] = parseMoney(elx.value);
      else if (f.type === 'number') out[f.name] = elx.value === '' ? '' : Number(elx.value);

  }

    var wrap = $('[data-field="' + f.name + '"]', form); if (!wrap) return;

    inp.addEventListener('blur', function () {
      var v = read()[f.name];

      else if (f.type === 'email' && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) fieldErr(f, 'Format email tidak valid');
      else if (f.type === 'number' && v !== '' && f.min !== undefined && v < f.min) fieldErr(f, 'Minimal ' + f.min);

  applyShow();
  var m = openModal({ title: o.title, wide: o.wide, body: form, buttons: [
    { label: 'Batal' },

  ] });
  form.addEventListener('submit', function (e) { e.preventDefault(); submit(m.close, $('.modal-foot .primary', m.el)); });
  function submit(close, btn) {
    var vals = read();

    var missing = dataFields.filter(function (f) {
      var hiddenF = f.show && !f.show(vals);
      return f.required && !hiddenF && (vals[f.name] === '' || vals[f.name] === undefined);
    });
    dataFields.forEach(function (f) { fieldErr(f, ''); });
    if (missing.length) {
      missing.forEach(function (f) { fieldErr(f, f.label + ' wajib diisi'); });
      err.innerHTML = icon('circle-alert') + '<span>Lengkapi ' + missing.length + ' kolom wajib: ' + esc(missing.map(function (f) { return f.label; }).join(', ')) + '</span>';

function parseMoney(s) {

/* ---------- tabel ---------- */
/**
 * Table(opts): columns [{key,label,render(row),sort(row)|true,align,primary,export(row),width}], rows,
 * search (bool), pageSize, onRowClick(row), empty, exportName, title, tools (html), group(row) untuk baris grup.
 */
function Table(o) {
  var st = { q: '', sort: o.defaultSort || null, dir: o.defaultDir || 1, page: 1 };
  var size = o.pageSize || 25;
  var root = h('<div class="tbl-box"></div>');
  if (o.search !== false || o.tools || o.exportName) {
    var tools = h('<div class="tbl-tools">' + (o.search !== false ? '<div class="search-in">' + icon('search') + '<input class="input" type="search" placeholder="Cari di tabel…" aria-label="Cari di tabel"></div>' : '') +
      '<div class="filters">' + (o.tools || '') + '</div><div class="spacer"></div>' +
      (o.exportName ? '<button class="btn sm" data-x="xlsx" data-tip="Unduh Excel (.xlsx)">' + icon('file-spreadsheet') + 'Excel</button><button class="btn sm" data-x="pdf" data-tip="Unduh PDF">' + icon('file-text') + 'PDF</button>' : '') + '</div>');
    root.appendChild(tools);
    var si = $('input[type=search]', tools);
    if (si) si.addEventListener('input', debounce(function () { st.q = si.value.trim().toLowerCase(); st.page = 1; draw(); }, 150));
    $$('[data-x]', tools).forEach(function (b) { b.addEventListener('click', function () { exportTable(b.getAttribute('data-x')); }); });
  }
  var wrap = h('<div class="table-wrap"><table class="tbl ' + (o.cards === false ? '' : 'cards') + '"><thead></thead><tbody></tbody></table></div>');
  root.appendChild(wrap);
  var foot = h('<div class="tbl-foot"><span class="info"></span><div class="pager"></div></div>');
  root.appendChild(foot);
  var thead = $('thead', wrap), tbody = $('tbody', wrap);
  var allCols = o.columns;
  var viewCols = allCols.filter(function (c) { return !c.exportOnly; });
  thead.innerHTML = '<tr>' + viewCols.map(function (c, i) {
    return '<th data-i="' + i + '" class="' + (c.sort ? 'sortable ' : '') + (c.align === 'right' ? 'right' : c.align === 'center' ? 'center' : '') + '"' + (c.width ? ' style="width:' + c.width + '"' : '') + '>' + esc(c.label) + '<span class="arr"></span></th>';
  }).join('') + '</tr>';
  $$('th.sortable', thead).forEach(function (th) {
    th.addEventListener('click', function () {
      var i = Number(th.getAttribute('data-i'));
      if (st.sort === i) st.dir = -st.dir; else { st.sort = i; st.dir = 1; }
      draw();
    });
  });
  function plain(c, r) {
    if (c.export) return c.export(r);
    var v = c.render ? c.render(r) : r[c.key];
    return String(v === null || v === undefined ? '' : v).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').replace(/&amp;/g, '&').replace(/&mdash;|—/g, '').trim();
  }
  function filtered() {
    var rows = (o.rows || []).slice();
    if (st.q) rows = rows.filter(function (r) {
      return viewCols.some(function (c) { return plain(c, r).toLowerCase().indexOf(st.q) >= 0; });
    });
    if (st.sort !== null && viewCols[st.sort]) {
      var c = viewCols[st.sort];
      var val = typeof c.sort === 'function' ? c.sort : function (r) { return r[c.key]; };
      rows.sort(function (a, b) {
        var x = val(a), y = val(b);
        if (x === y) return 0;
        if (x === '' || x === null || x === undefined) return 1;
        if (y === '' || y === null || y === undefined) return -1;
        return (x > y ? 1 : -1) * st.dir;
      });
    }
    return rows;
  }
  function draw() {
    var rows = filtered();
    var pages = Math.max(1, Math.ceil(rows.length / size));
    st.page = Math.min(st.page, pages);
    var view = o.paginate === false ? rows : rows.slice((st.page - 1) * size, st.page * size);
    $$('th', thead).forEach(function (th, i) { $('.arr', th).textContent = st.sort === i ? (st.dir > 0 ? ' ▲' : ' ▼') : ''; });
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="' + viewCols.length + '"><div class="empty">' + icon(st.q ? 'search' : 'inbox') + '<div>' + esc(st.q ? 'Tidak ada baris yang cocok dengan "' + st.q + '".' : (o.empty || 'Belum ada data.')) + '</div></div></td></tr>';
    } else {
      var html = '', lastGroup = null;
      view.forEach(function (r, idx) {
        if (o.group) {
          var g = o.group(r);
          if (g !== lastGroup) { html += '<tr class="group-row"><td colspan="' + viewCols.length + '">' + (o.groupHtml ? o.groupHtml(g) : esc(g)) + '</td></tr>'; lastGroup = g; }
        }
        html += '<tr data-idx="' + idx + '" class="' + (o.onRowClick ? 'clickable ' : '') + (o.rowClass ? o.rowClass(r) : '') + '">' + viewCols.map(function (c) {
          var v = c.render ? c.render(r) : esc(r[c.key] === undefined || r[c.key] === '' ? '—' : r[c.key]);
          return '<td data-label="' + esc(c.label) + '" class="' + (c.align === 'right' ? 'right num ' : c.align === 'center' ? 'center ' : '') + (c.primary ? 'primary-cell ' : '') + (c.actions ? 'actions-cell ' : '') + (c.cls || '') + '">' + v + '</td>';
        }).join('') + '</tr>';
      });
      if (o.totalRow) html += o.totalRow(rows);
      tbody.innerHTML = html;
      if (o.onRowClick) $$('tr.clickable', tbody).forEach(function (tr) {
        tr.addEventListener('click', function (e) {
          if (e.target.closest('button,a,input,select,label')) return;
          o.onRowClick(view[Number(tr.getAttribute('data-idx'))]);
        });
      });
      if (o.onDraw) o.onDraw(tbody, view);
    }
    $('.info', foot).textContent = rows.length ? ((o.paginate === false ? 1 : (st.page - 1) * size + 1) + '–' + (o.paginate === false ? rows.length : Math.min(st.page * size, rows.length)) + ' dari ' + rows.length + ' baris') : '0 baris';
    var pager = $('.pager', foot);
    pager.innerHTML = pages > 1 && o.paginate !== false ? '<button class="btn sm" data-p="-1"' + (st.page === 1 ? ' disabled' : '') + '>‹</button><span class="small" style="padding:5px 8px">' + st.page + ' / ' + pages + '</span><button class="btn sm" data-p="1"' + (st.page === pages ? ' disabled' : '') + '>›</button>' : '';
    $$('[data-p]', pager).forEach(function (b) { b.addEventListener('click', function () { st.page += Number(b.getAttribute('data-p')); draw(); }); });
    foot.classList.toggle('hidden', !!o.hideFoot);
  }
  function exportTable(kind) {
    var cols = allCols.filter(function (c) { return !c.actions && c.exportable !== false; });
    var rows = filtered().map(function (r) { return cols.map(function (c) { return plain(c, r); }); });
    var head = cols.map(function (c) { return c.label; });
    if (kind === 'xlsx') {
      downloadBlob(xlsxBlob(o.exportName, head, rows), o.exportName.replace(/[^\w\- ]+/g, '') + ' ' + todayIso() + '.xlsx');
      toast('File Excel diunduh.', 'success');
    } else {
      toast('Menyiapkan PDF…');
      api('export.pdf', { title: o.exportName, subtitle: o.exportSubtitle || '', columns: head, rows: rows }).then(function (r) {
        downloadBlob(b64toBlob(r.base64, 'application/pdf'), r.filename);
        toast('File PDF diunduh.', 'success');
      }).catch(function (e) { toast(e.message, 'error'); });
    }
  }
  root.setRows = function (rows) { o.rows = rows; draw(); };
  root.redraw = draw;
  draw();
  return root;
}

/* ---------- unduhan ---------- */
function downloadBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function b64toBlob(b64, type) {
  var bin = atob(b64), arr = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: type });
}

/* badge merah di menu: jumlah yang perlu ditindaklanjuti */
function loadNavBadges() {
  Promise.all([api('survey.list', {}), api('docking.list', {}), api('redo.list', { is_redo: true }), api('atr.list', { overdue: true }), api('facility.list', {})]).then(function (r) {
    var n = {
      schedule: r[0].filter(function (s) { return s.status !== 'Done' && (s.band.key === 'overdue' || s.band.key === 'due'); }).length,
      docking: r[1].filter(function (d) { return d.status === 'Delayed' || d.overtime_status === 'Ongoing Delay'; }).length,
      'post-docking': r[2].filter(function (x) { return x.status !== 'Closed'; }).length,
      atr: r[3].length,
      facility: r[4].filter(function (f) { return ['Requested', 'Rejected', 'Unavailable'].indexOf(f.status) >= 0; }).length
    };
    Object.keys(n).forEach(function (k) {
      var el = $('[data-badge="' + k + '"]'); if (!el) return;
      el.textContent = n[k] > 99 ? '99+' : n[k]; el.classList.toggle('hidden', !n[k]);
      el.parentNode.setAttribute('aria-label', el.parentNode.textContent.replace(/\d+\+?$/, '').trim() + (n[k] ? ' (' + n[k] + ' perlu tindakan)' : ''));
    });
    App.navCounts = n;
  }).catch(function () {});
}
function fmtDayFull(iso) {
  var d = new Date(iso + 'T00:00:00'), hari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  return hari[d.getDay()] + ', ' + Number(iso.slice(8, 10)) + ' ' + BULAN_PANJANG[Number(iso.slice(5, 7)) - 1] + ' ' + iso.slice(0, 4);

function monthGrid(s, year) {
  var cells = '';
  for (var m = 1; m <= 12; m++) {
    var ms = year + '-' + (m < 10 ? '0' : '') + m, start = ms + '-01', end = ms + '-31';
    var cls = [];
    if (s.open_window && s.close_window && s.open_window <= end && s.close_window >= start) cls.push('win');
    if (s.due_date && s.due_date.slice(0, 7) === ms) cls.push('due');
    if (s.actual_date && s.actual_date.slice(0, 7) === ms) cls.push('done');
    if (s.bulan_rencana && Number(s.bulan_rencana) === m && s.due_date.slice(0, 4) === String(year) && !s.actual_date) cls.push('plan');
    cells += '<span class="' + cls.join(' ') + '" title="' + BULAN[m - 1] + ' ' + year + '"></span>';
  }
  return '<div class="mgrid">' + cells + '</div>';
}

function ganttTip(root, getHtml) {
  var tip = null;
  root.addEventListener('mousemove', function (e) {
    var el = e.target.closest('[data-b],[data-d],[data-h]');
    if (!el) { if (tip) { tip.remove(); tip = null; } return; }
    var html = getHtml(el); if (!html) return;
    if (!tip) { tip = h('<div class="g-tip"></div>'); document.body.appendChild(tip); }
    tip.innerHTML = html;
    var x = e.clientX + 14, y = e.clientY + 14, w = tip.offsetWidth, hh = tip.offsetHeight;
    if (x + w > window.innerWidth - 8) x = e.clientX - w - 14;
    if (y + hh > window.innerHeight - 8) y = e.clientY - hh - 14;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  root.addEventListener('mouseleave', function () { if (tip) { tip.remove(); tip = null; } });
  new MutationObserver(function () { if (!document.body.contains(root) && tip) { tip.remove(); tip = null; } }).observe(document.body, { childList: true, subtree: false });
}

function jobGantt(items) {

    head += '<div class="g-month" style="left:' + (i * DW) + 'px;width:' + DW + 'px">' + dd + '</div>';

  var t = todayIso(), tl = t >= start && t <= end ? '<div class="g-today" style="left:' + X(t) + 'px"></div>' : '';
  var rows = '', last = null;
  dated.forEach(function (j) {
    if (j.kelompok !== last) { rows += '<div class="g-row ship-row"><div class="g-label-col">' + esc(j.kelompok || 'Tanpa kelompok') + '</div><div class="g-track" style="width:' + W + 'px">' + grid + tl + '</div></div>'; last = j.kelompok; }
    var pf = j.plan_finish || j.plan_start, af = j.actual_finish || (j.actual_start ? t : null);

      (j.plan_start ? '<div class="g-bar" style="top:6px;height:9px;left:' + X(j.plan_start) + 'px;width:' + Math.max(X(pf) - X(j.plan_start) + DW, DW) + 'px;background:var(--primary-200);opacity:1" title="Rencana ' + fmtDate(j.plan_start) + ' – ' + fmtDate(pf) + '"></div>' : '') +
      (j.actual_start ? '<div class="g-bar solid" style="top:18px;height:9px;left:' + X(j.actual_start) + 'px;width:' + Math.max(X(af) - X(j.actual_start) + DW, DW) + 'px;background:' + color + '" title="Aktual ' + fmtDate(j.actual_start) + ' – ' + fmtDate(j.actual_finish) + '"></div>' : '') + tl + '</div></div>';
  });
  return h('<div class="gantt"><div class="gantt-inner" style="width:' + (W + 250) + 'px">' + head + rows + '</div></div>');
}

        { label: 'Email', key: 'email' }, { label: 'Jabatan', key: 'jabatan' },
        { label: 'Peran', render: function (u) { return badge(u.peran, u.peran === 'Admin' ? 'navy' : u.peran === 'Editor' ? 'blue' : ''); }, export: function (u) { return u.peran; } },
        { label: 'Status', render: function (u) { return badge(u.status, u.status === 'Aktif' ? 'green' : '') + (u.wajib_ganti_sandi ? ' ' + badge('Wajib ganti sandi', 'yellow') : ''); }, export: function (u) { return u.status; } },
        { label: 'Login terakhir', render: function (u) { return u.last_login ? fmtDate(String(u.last_login).slice(0, 10)) + ' <span class="tiny muted">' + String(u.last_login).slice(11, 16) + '</span>' : '<span class="faint">Belum pernah</span>'; }, export: function (u) { return u.last_login; } },
        { label: '', actions: true, render: function (u) { return '<button class="btn sm ghost" data-ed="' + u.id + '">' + icon('edit') + '</button><button class="btn sm ghost" data-rs="' + u.id + '" title="Reset sandi">' + icon('key') + '</button>'; } }],
        onDraw: function (tb) {
          bind(tb, '[data-ed]', 'click', function (e) {
            var u = findBy(list, e.currentTarget.getAttribute('data-ed'));
            formModal({ title: 'Edit pengguna ' + u.username, values: u, fields: [{ name: 'nama', label: 'Nama', required: true }, { name: 'jabatan', label: 'Jabatan' },
              { name: 'peran', label: 'Peran', type: 'select', required: true, options: App.boot.roles }, { name: 'status', label: 'Status', type: 'select', required: true, options: App.boot.enums.user_status }],
              onSubmit: function (v) { return api('users.update', { id: u.id, nama: v.nama, jabatan: v.jabatan, peran: v.peran, status: v.status }); }, successMsg: 'Pengguna disimpan.', after: function () { router({ quiet: true }); } });
          });
          bind(tb, '[data-rs]', 'click', function (e) {
            var u = findBy(list, e.currentTarget.getAttribute('data-rs'));
            confirmDialog('Reset sandi ' + u.nama + '? Sandi sementara ditampilkan sekali dan wajib diganti saat login.', { ok: 'Reset sandi' }).then(function (y) {
              if (y) api('users.resetPassword', { id: u.id }).then(function (r) {
                openModal({ title: 'Sandi sementara', body: '<p class="small">Berikan sandi ini kepada ' + esc(u.nama) + ' lewat jalur pribadi. Sandi tidak akan ditampilkan lagi.</p><div class="code-box">' + esc(r.temporary_password) + '</div>', buttons: [{ label: 'Selesai', cls: 'primary' }] });
              }).catch(function (er) { toast(er.message, 'error'); });
            });
          });
        } }));
      return node;
    });
  }
};

/* ------------------------------------------------------------ CONFIGURATION */
App.pages.config = {
  title: 'Configuration', role: 'Admin', tabs: ['APP_Config', 'APP_Activity_Log'],
  crumbs: function (r) { return [['Configuration', '#/config'], [r.params[0] === 'log' ? 'Log aktivitas' : r.params[0] === 'system' ? 'Sistem' : 'Pengaturan']]; },
  render: function (r) {
    var tab = r.params[0] || 'settings';
    var head = configHead(tab);
    if (tab === 'log') return api('log.list', { limit: 500 }).then(function (list) {
      var n = h('<div>' + head + '<div class="card" id="t"></div></div>');
      $('#t', n).appendChild(Table({ rows: list, exportName: 'Log Aktivitas', pageSize: 30, columns: [
        { label: 'Waktu', render: function (l) { return '<span class="nowrap">' + fmtDate(String(l.waktu).slice(0, 10)) + ' <span class="muted">' + String(l.waktu).slice(11, 16) + '</span></span>'; }, export: function (l) { return l.waktu; } },
        { label: 'Pengguna', key: 'user' }, { label: 'Aksi', render: function (l) { return badge(l.aksi, { create: 'green', update: 'blue', delete: 'red', restore: 'yellow', login: '' }[l.aksi] || ''); }, export: function (l) { return l.aksi; } },
        { label: 'Entitas', render: function (l) { return '<span class="small">' + esc(String(l.entitas).replace('APP_', '')) + '</span> <span class="tiny muted">' + esc(l.entity_id) + '</span>'; }, export: function (l) { return l.entitas + ' ' + l.entity_id; } },
        { label: 'Ringkasan', primary: true, render: function (l) { return '<span class="small">' + esc(l.ringkasan) + '</span>'; }, export: function (l) { return l.ringkasan; } }] }));
      return n;
    });
    if (tab === 'system') return api('admin.check', {}).then(function (c) {
      var n = h('<div>' + head + '<div class="grid g2"><div class="card"><div class="card-head"><h2>Pemeriksaan instalasi</h2>' + badge(c.ok ? 'Siap' : 'Perlu tindakan', c.ok ? 'green' : 'red') + '</div><div class="card-body" id="chk"></div></div>' +
        '<div class="card"><div class="card-head"><h2>Tindakan</h2></div><div class="card-body stack">' +
        btnHtml('Jalankan pengecekan harian sekarang', 'refresh', '', 'id="daily"') + btnHtml('Hitung ulang window survey', 'calendar', '', 'id="recalc"') +
        '<p class="small muted">Pengecekan harian berjalan otomatis pukul 06.00 WIB dan ringkasan email mingguan dikirim sesuai pengaturan. Keduanya membutuhkan trigger yang dipasang dari menu Docking App di spreadsheet.</p></div></div></div></div>');
      var items = [['Spreadsheet', true, c.spreadsheet], ['Tab database', !c.problems.some(function (p) { return /Tab belum ada|kekurangan kolom/.test(p); }), c.tabs.length + ' tab APP_ ditemukan'],
        ['Admin aktif', c.admin, c.admin ? 'Minimal satu Admin aktif' : 'Belum ada Admin aktif'], ['Trigger otomatis', c.triggers.indexOf('dailyCheck') >= 0, c.triggers.length ? c.triggers.join(', ') : 'Belum ada trigger terpasang']];
      $('#chk', n).innerHTML = items.map(function (i) { return '<div class="row" style="padding:7px 0;border-bottom:1px solid var(--border)">' + (i[1] ? '<span style="color:var(--green)">' + icon('check') + '</span>' : '<span style="color:var(--red)">' + icon('alert') + '</span>') + '<div><div class="small"><b>' + esc(i[0]) + '</b></div><div class="tiny muted">' + esc(i[2] || '') + '</div></div></div>'; }).join('') +
        (c.problems.length ? '<div class="small" style="margin-top:10px;color:var(--red)">' + c.problems.map(esc).join('<br>') + '</div>' : '') +
        '<div class="small muted" style="margin-top:10px">Jumlah baris: ' + Object.keys(c.counts).filter(function (k) { return c.counts[k]; }).map(function (k) { return esc(k.replace('APP_', '')) + ' ' + c.counts[k]; }).join(' \u00b7 ') + '</div>';
      $('#daily', n).addEventListener('click', function () { apiToast('admin.dailyCheck', {}).then(function (r) { toast(r.notifikasi_baru + ' notifikasi baru dibuat.', 'success'); loadNotifCount(); }); });
      $('#recalc', n).addEventListener('click', function () { apiToast('admin.recalcWindows', {}).then(function (r) { toast(r.diperbarui + ' jadwal diperbarui.', 'success'); }); });
      return n;
    });
    return api('config.list', {}).then(function (list) {
      var n = h('<div>' + head + '<div class="card" id="t"></div></div>');
      $('#t', n).appendChild(Table({ rows: list, search: true, paginate: false, columns: [
        { label: 'Pengaturan', primary: true, render: function (c) { return '<b class="small">' + esc(c.key) + '</b><div class="tiny muted">' + esc(c.keterangan) + '</div>'; } },
        { label: 'Nilai', render: function (c) { return '<input class="input cfg" data-k="' + esc(c.key) + '" value="' + esc(c.value) + '" style="min-width:160px" aria-label="' + esc(c.key) + '">'; } },
        { label: 'Diubah', render: function (c) { return c.updated_by ? '<span class="tiny muted">' + esc(c.updated_by) + '<br>' + fmtDate(String(c.updated_at).slice(0, 10)) + '</span>' : '<span class="faint small">Bawaan</span>'; } }],
        onDraw: function (tb) { bind(tb, 'input.cfg', 'change', function (e) {
          var inp = e.currentTarget;
          api('config.save', { key: inp.getAttribute('data-k'), value: inp.value.trim() }).then(function () { inp.classList.remove('invalid'); toast('Pengaturan disimpan.', 'success'); refreshBoot(); })
            .catch(function (er) { inp.classList.add('invalid'); toast(er.message, 'error'); });
        }); } }));
      return n;
    });
  }
};
</script>
